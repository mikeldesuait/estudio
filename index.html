<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📚 Estudio Personal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/shell/shell.css">
  <link rel="stylesheet" href="css/shell/pomodoro-config.css">
  <link rel="stylesheet" href="css/shell/escritorio.css">
  <script src="https://cdn.jsdelivr.net/npm/interactjs@1.10.26/dist/interact.min.js"></script>
</head>
<body>
  <main id="mainContent" class="container">
    <div style="padding:40px;text-align:center;color:#718096;font-family:Inter,sans-serif;">
      <i class="fas fa-spinner fa-spin"></i> Cargando...
    </div>
  </main>

  <!-- ═══════════════════════════════════════════════════════
       BASE + url() helper (detección automática local/GitHub)
       ═══════════════════════════════════════════════════════ -->
  <script>
    (function() {
      const path = window.location.pathname;
      let base = '';

      if (path.startsWith('/estudio/') || path === '/estudio') {
        if (window.location.hostname.endsWith('.github.io')) {
          base = '/estudio';
        }
      }

      window.BASE = base;
      console.log('🌐 Host:', window.location.hostname);
      console.log('🌐 Path:', path);
      console.log('🌐 BASE detectada:', window.BASE || '(raíz)');
    })();

    window.url = function(ruta) {
      ruta = ruta.replace(/^\//, '');
      const base = window.BASE || '';
      return base + '/' + ruta;
    };
  </script>

  <!-- ═══════════════════════════════════════════════════════
       Carga de áreas (equivalente al app.js actual)
       ═══════════════════════════════════════════════════════ -->
  <script>
    window.AREAS = [];
    const LISTA_AREAS = [
      { id: 'grado-derecho' },
      { id: 'pnl' },
      { id: 'herramientas' },
      { id: 'networking' },
      { id: 'dieta' }
    ];

    window.AREAS_LISTAS = Promise.all(LISTA_AREAS.map(item =>
      fetch(url('estudio/' + item.id + '/config.json'))
        .then(r => r.json())
        .then(data => {
          window.AREAS.push({ id: item.id, path: 'estudio/' + item.id + '/', ...data });
        })
        .catch(e => console.warn('No se pudo cargar', item.id, e))
    )).then(() => {
      console.log('✅ Áreas cargadas:', window.AREAS.length);
    });
  </script>

  <!-- ═══════════════════════════════════════════════════════
       Módulos del shell
       ═══════════════════════════════════════════════════════ -->
  <script src="js/widgets/progreso.js"></script>
  <script src="js/widgets/pomodoro.js"></script>
  <script src="js/core/router.js"></script>
  <script src="js/vistas/escritorio.js"></script>
  <script src="js/vistas/index.js"></script>
  <script src="js/core/shell.js"></script>

  <!-- ═══════════════════════════════════════════════════════
       Arranque: montar shell + ir al escritorio
       ═══════════════════════════════════════════════════════ -->
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Esperar a que las áreas estén cargadas
      await window.AREAS_LISTAS;

      // Montar el shell
      Shell.montar();

      // Detectar si venimos de una URL con ?nivel=... (deep link)
      const params = new URLSearchParams(window.location.search);
      const nivel = params.get('nivel') || 'escritorio';

      if (nivel === 'escritorio') {
        Router.navegar('escritorio');
      } else {
        const p = {};
        if (params.get('area')) p.areaId = params.get('area');
        if (params.get('curso')) p.cursoId = params.get('curso');
        if (params.get('semestre')) p.semestreId = params.get('semestre');
        if (params.get('asignatura')) p.asignaturaId = params.get('asignatura');
        if (params.get('tema')) p.temaId = params.get('tema');
        Router.navegar(nivel, p);
      }
    });
  </script>
</body>
</html>
