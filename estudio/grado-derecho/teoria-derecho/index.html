<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Teoría del Derecho</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/themes.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin: 16px 0;
        }
        .info-card {
            background: var(--bg-card);
            border-radius: 10px;
            padding: 16px 20px;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 14px;
            transition: all 0.3s ease;
            text-decoration: none;
            color: var(--text-primary);
            cursor: pointer;
        }
        .info-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
            border-color: var(--accent);
        }
        .info-card .icon { font-size: 28px; flex-shrink: 0; }
        .info-card .info { display: flex; flex-direction: column; }
        .info-card .info .titulo { font-weight: 600; font-size: 15px; }
        .info-card .info .subtitulo { font-size: 12px; color: var(--text-secondary); }
        .badge-pdf { background: #ef4444; color: white; font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: 600; margin-left: 6px; }
    </style>
</head>
<body>
    <div class="container" style="padding-top:80px; max-width:900px; margin:0 auto;">
        <div class="area-header">
            <button class="btn btn-outline" onclick="volver()">← Volver a las asignaturas</button>
            <h1>⚖️ Teoría del Derecho</h1>
            <p style="color:var(--text-secondary);">Código: 66021021 | 6 ECTS</p>
        </div>
        
        <div class="card">
            <h2>📚 Materiales de la asignatura</h2>
            <div class="info-grid">
                <a href="guia/guia.pdf" class="info-card" target="_blank">
                    <span class="icon">📘</span>
                    <div class="info">
                        <span class="titulo">Guía de la asignatura</span>
                        <span class="subtitulo">PDF <span class="badge-pdf">PDF</span></span>
                    </div>
                </a>
                <a href="programa/programa.pdf" class="info-card" target="_blank">
                    <span class="icon">📋</span>
                    <div class="info">
                        <span class="titulo">Programa de la asignatura</span>
                        <span class="subtitulo">PDF <span class="badge-pdf">PDF</span></span>
                    </div>
                </a>
            </div>
            <div style="font-size:13px; color:var(--text-secondary); margin-top:8px;">
                <i class="fas fa-info-circle"></i> Haz clic en las tarjetas para abrir los PDFs en una nueva pestaña.
            </div>
        </div>
        
        <div class="card">
            <h2>📑 Temas</h2>
            <div class="temas-list">
                <div class="tema-item" onclick="window.location.href='temas/tema1/index.html'">
                    <div class="tema-info">
                        <span class="tema-numero">1</span>
                        <span class="tema-titulo">Tema 1 - Introducción</span>
                    </div>
                    <div class="tema-progreso">
                        <span id="progresoDisplay">0%</span>
                        <i class="fas fa-chevron-right"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function volver() {
            if (typeof window.navegar === 'function') {
                window.navegar('asignaturas', 'grado-derecho', '1', '1');
            } else {
                window.location.href = '/';
            }
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            const progreso = localStorage.getItem('progreso_tema_teoria-derecho-tema1');
            if (progreso) {
                document.getElementById('progresoDisplay').textContent = progreso + '%';
            }
        });
    </script>
</body>
</html>
