    function wsAbrirSelectorPlato(dia, comida) {
        // Evitar duplicados
        if (wsModalActual) wsModalActual.remove();

        const nombreComida = WS_COMIDAS_ETIQUETA[comida] || comida;
        const nombreDia = WS_DIAS_ETIQUETA[dia] || dia;
        const emojiComida = (WS_EMOJIS_COMIDA && WS_EMOJIS_COMIDA[comida]) || '🍽️';
        const emojiDia = (WS_EMOJIS_DIA && WS_EMOJIS_DIA[dia]) || '📅';

        // Categorías a mostrar
        const categoriasBase = (typeof FOOD_DB !== 'undefined' && FOOD_DB[comida]) ? FOOD_DB[comida] : {};

        // Alimentos personalizados (si el usuario tiene en Crear Menú)
        let personalizados = [];
        if (typeof customFoods !== 'undefined' && customFoods && customFoods[comida]) {
            personalizados = customFoods[comida] || [];
        }

        // Valor actual de la celda
        const valorActual = (wsMenu.dias[dia][comida] || '').trim();

        // ─── Construir el modal ───
        const overlay = document.createElement('div');
        overlay.className = 'ws-modal-overlay';

        const modal = document.createElement('div');
        modal.className = 'ws-modal';

        // Header
        const header = document.createElement('div');
        header.className = 'ws-modal-header';
        header.innerHTML = '<h2 class="ws-modal-title">' + emojiComida + ' ' + nombreComida + ' · ' + emojiDia + ' ' + nombreDia + '</h2>';
        const closeBtn = document.createElement('button');
        closeBtn.className = 'ws-modal-close';
        closeBtn.innerHTML = '✕';
        closeBtn.title = 'Cerrar (Esc)';
        closeBtn.onclick = () => wsCerrarModal();
        header.appendChild(closeBtn);
        modal.appendChild(header);

        // Toolbar (buscador)
        const toolbar = document.createElement('div');
        toolbar.className = 'ws-modal-toolbar';
        const searchInput = document.createElement('input');
        searchInput.type = 'text';
        searchInput.className = 'ws-modal-search';
        searchInput.placeholder = '🔍 Buscar plato...';
        toolbar.appendChild(searchInput);
        modal.appendChild(toolbar);

        // Body
        const body = document.createElement('div');
        body.className = 'ws-modal-body';

        // Categoría: personalizados primero
        if (personalizados.length > 0) {
            const cat = wsCrearCategoria('✍️ Mis alimentos personalizados', personalizados, comida, dia, valorActual, true);
            body.appendChild(cat);
        }

        // Categorías del FOOD_DB
        Object.keys(categoriasBase).forEach(catKey => {
            const items = categoriasBase[catKey] || [];
            if (items.length === 0) return;
            const nombreCat = WS_CAT_NOMBRES[catKey] || catKey;
            const cat = wsCrearCategoria(nombreCat, items, comida, dia, valorActual, false);
            body.appendChild(cat);
        });

        // Mensaje si no hay nada
        const totalItems = personalizados.length + Object.values(categoriasBase).reduce((s, arr) => s + arr.length, 0);
        if (totalItems === 0) {
            const vacio = document.createElement('div');
            vacio.className = 'ws-no-results';
            vacio.textContent = 'No hay platos en esta categoría. Usa el campo de abajo para escribir uno.';
            body.appendChild(vacio);
        }

        modal.appendChild(body);

        // Footer (manual + borrar)
        const footer = document.createElement('div');
        footer.className = 'ws-modal-footer';

        const manualInput = document.createElement('input');
        manualInput.type = 'text';
        manualInput.className = 'ws-manual-input';
        manualInput.placeholder = '✏️ Escribir manualmente y pulsar Enter...';
        manualInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                const txt = manualInput.value.trim();
                if (!txt) return;
                wsAplicarPlato(dia, comida, txt, { manual: true, guardarEnCatalogo: true });
            }
        });
        footer.appendChild(manualInput);

        const btnBorrar = document.createElement('button');
        btnBorrar.className = 'ws-modal-btn danger';
        btnBorrar.textContent = '🗑️ Borrar';
        btnBorrar.onclick = () => {
            wsAplicarPlato(dia, comida, '');
        };
        footer.appendChild(btnBorrar);

        const btnCerrar = document.createElement('button');
        btnCerrar.className = 'ws-modal-btn';
        btnCerrar.textContent = 'Cancelar';
        btnCerrar.onclick = () => wsCerrarModal();
        footer.appendChild(btnCerrar);

        modal.appendChild(footer);

        overlay.appendChild(modal);
        document.body.appendChild(overlay);
        wsModalActual = overlay;

        // Foco en el buscador
        setTimeout(() => searchInput.focus(), 60);

        // Buscador: filtra items visibles
        searchInput.addEventListener('input', () => {
            const q = searchInput.value.trim().toLowerCase();
            body.querySelectorAll('.ws-cat').forEach(cat => {
                let visibles = 0;
                cat.querySelectorAll('.ws-item').forEach(it => {
                    const coincide = q === '' || it.textContent.toLowerCase().includes(q);
                    it.style.display = coincide ? '' : 'none';
                    if (coincide) visibles++;
                });
                // Mostrar/ocultar categoría y abrirla si hay coincidencias
                cat.style.display = visibles > 0 ? '' : 'none';
                if (q !== '' && visibles > 0) cat.classList.add('open');
                if (q === '') cat.classList.remove('open');
            });
        });

        // Cerrar con Escape
        const onKey = (e) => {
            if (e.key === 'Escape') wsCerrarModal();
        };
        document.addEventListener('keydown', onKey);
        overlay._onKey = onKey;

        // Cerrar al hacer clic en el overlay (fuera del modal)
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) wsCerrarModal();
        });
    }

    function wsCrearCategoria(nombre, items, comida, dia, valorActual, esPersonalizada) {
        const cat = document.createElement('div');
        cat.className = 'ws-cat';

        const header = document.createElement('div');
        header.className = 'ws-cat-header';
        header.innerHTML = '<span>' + nombre + ' <span class="ws-cat-count">' + items.length + '</span></span><span class="ws-cat-arrow">▶</span>';
        header.onclick = () => cat.classList.toggle('open');
        cat.appendChild(header);

        const itemsDiv = document.createElement('div');
        itemsDiv.className = 'ws-cat-items';

        items.forEach(item => {
            const el = document.createElement('span');
            el.className = 'ws-item' + (esPersonalizada ? ' custom' : '');
            if (item === valorActual) el.classList.add('selected');
            el.textContent = item;
            el.title = esPersonalizada
                ? 'Clic para elegir · Clic derecho para eliminar del catálogo'
                : 'Clic para elegir';
            el.onclick = () => wsAplicarPlato(dia, comida, item);
            if (esPersonalizada) {
                el.oncontextmenu = (e) => {
                    e.preventDefault();
                    if (confirm('¿Eliminar "' + item + '" de tus alimentos personalizados?')) {
                        wsEliminarDelCatalogo(comida, item);
                        wsAbrirSelectorPlato(dia, comida); // re-render
                    }
                };
            }
            itemsDiv.appendChild(el);
        });

        cat.appendChild(itemsDiv);
        return cat;
    }

    function wsAplicarPlato(dia, comida, valor, opciones) {
        opciones = opciones || {};
        const guardarEnCatalogo = opciones.guardarEnCatalogo !== false; // por defecto sí
        const esManual = !!opciones.manual;

        valor = (valor || '').trim();

        // Actualizar objeto del menú
        wsMenu.dias[dia][comida] = valor;

        // Si es manual (escrito por el usuario) y hay que guardarlo, añadir a customFoods
        if (esManual && valor && guardarEnCatalogo) {
            wsGuardarEnCatalogo(comida, valor);
        }

        // Actualizar el DOM de esa celda
        const celda = document.querySelector('.weekly-cell-input[data-dia="' + dia + '"][data-comida="' + comida + '"]');
        if (celda) {
            celda.textContent = valor;
            celda.classList.remove('editing');
        }

        wsCerrarModal();
    }

    function wsGuardarEnCatalogo(comida, valor) {
        try {
            // Asegurar que customFoods existe
            if (typeof customFoods === 'undefined' || !customFoods) {
                window.customFoods = {};
            }
            if (!Array.isArray(customFoods[comida])) {
                customFoods[comida] = [];
            }

            // No duplicar
            if (customFoods[comida].indexOf(valor) !== -1) {
                console.log('ℹ️ Plato ya estaba en catálogo:', valor);
                return false;
            }

            customFoods[comida].push(valor);
            console.log('✅ Añadido a catálogo [' + comida + ']:', valor);

            // Persistir (usar la función existente si está)
            if (typeof saveToStorage === 'function') {
                saveToStorage('customFoods');
                console.log('   → guardado con saveToStorage');
            } else {
                // Fallback: probar varias claves típicas
                const claves = ['diet_custom_foods', 'diet_custom_foods_v4', 'customFoods'];
                claves.forEach(k => {
                    try {
                        localStorage.setItem(k, JSON.stringify(customFoods));
                    } catch (e) {}
                });
                console.log('   → guardado en localStorage (fallback)');
            }
            return true;
        } catch (e) {
            console.error('Error guardando en catálogo:', e);
            return false;
        }
    }

    function wsEliminarDelCatalogo(comida, valor) {
        try {
            if (typeof customFoods === 'undefined' || !customFoods[comida]) return;
            const idx = customFoods[comida].indexOf(valor);
            if (idx === -1) return;
            customFoods[comida].splice(idx, 1);

            if (typeof saveToStorage === 'function') {
                saveToStorage('customFoods');
            } else {
                const claves = ['diet_custom_foods', 'diet_custom_foods_v4', 'customFoods'];
                claves.forEach(k => {
                    try { localStorage.setItem(k, JSON.stringify(customFoods)); } catch (e) {}
                });
            }
            console.log('🗑️ Eliminado del catálogo:', valor);
        } catch (e) {
            console.error('Error eliminando:', e);
        }
    }

    function wsCerrarModal() {
        if (wsModalActual) {
            if (wsModalActual._onKey) {
                document.removeEventListener('keydown', wsModalActual._onKey);
            }
            wsModalActual.remove();
            wsModalActual = null;
        }
    }

    function wsRenderWeeklyGrid() {
        const cont = document.getElementById('weeklyGrid');
        if (!cont) return;

        let html = '';

        // Cabecera con los días
        html += '<div class="weekly-cell weekly-corner">Comida</div>';
        WS_DIAS_SEMANA.forEach(d => {
            html += '<div class="weekly-cell weekly-day-header">' + WS_DIAS_ETIQUETA[d] + '</div>';
        });

        // Filas por cada comida
        WS_COMIDAS.forEach(comidaId => {
            html += '<div class="weekly-cell weekly-meal-header">' + WS_COMIDAS_ETIQUETA[comidaId] + '</div>';
            WS_DIAS_SEMANA.forEach(diaId => {
                const texto = wsMenu.dias[diaId][comidaId] || '';
                html += '<div class="weekly-cell weekly-cell-input" '
                    +   'data-dia="' + diaId + '" data-comida="' + comidaId + '" '
                    +   'title="Clic para elegir · Doble clic para escribir">'
                    +   escapeHtml(texto)
                    + '</div>';
            });
        });

        cont.innerHTML = html;

        // Conectar eventos: clic simple abre modal, doble clic edición manual
        cont.querySelectorAll('.weekly-cell-input').forEach(cell => {
            let clickTimer = null;

            // ─── Clic simple / doble clic ───
            cell.addEventListener('click', (e) => {
                // Si ya está en modo edición, no hacer nada
                if (cell.classList.contains('editing')) return;

                if (clickTimer) {
                    // Segundo clic → doble clic → edición manual
                    clearTimeout(clickTimer);
                    clickTimer = null;
                    wsEntrarModoEdicion(cell);
                } else {
                    // Primer clic → esperar a ver si hay segundo
                    clickTimer = setTimeout(() => {
                        clickTimer = null;
                        // Es un clic simple → abrir modal
                        const dia = cell.dataset.dia;
                        const comida = cell.dataset.comida;
                        if (dia && comida) {
                            wsAbrirSelectorPlato(dia, comida);
                        }
                    }, 220);
                }
            });

            // ─── Guardar cambios en modo edición ───
            cell.addEventListener('blur', () => {
                if (cell.classList.contains('editing')) {
                    const dia = cell.dataset.dia;
                    const comida = cell.dataset.comida;
                    const nuevoTexto = cell.textContent.trim();

                    // Si cambió, guardar
                    if (wsMenu.dias[dia][comida] !== nuevoTexto) {
                        wsMenu.dias[dia][comida] = nuevoTexto;

                        // Si es un plato nuevo manual, guardarlo en catálogo
                        if (nuevoTexto) {
                            wsGuardarEnCatalogo(comida, nuevoTexto);
                        }
                    }

                    cell.classList.remove('editing');
                    cell.removeAttribute('contenteditable');
                }
            });

            // ─── Enter = salir de edición · Escape = cancelar ───
            cell.addEventListener('keydown', (e) => {
                if (!cell.classList.contains('editing')) return;

                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    cell.blur();
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    // Restaurar valor original
                    const dia = cell.dataset.dia;
                    const comida = cell.dataset.comida;
                    cell.textContent = wsMenu.dias[dia][comida] || '';
                    cell.blur();
                }
            });
        });
    }

    function wsEntrarModoEdicion(cell) {
        // Cerrar modal si estuviera abierto
        wsCerrarModal();

        cell.classList.add('editing');
        cell.setAttribute('contenteditable', 'true');
        cell.focus();

        // Seleccionar todo el texto para sobrescribir fácilmente
        setTimeout(() => {
            try {
                const range = document.createRange();
                range.selectNodeContents(cell);
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(range);
            } catch (e) {}
        }, 30);
    }

    function wsRenderWeeklyCita() {
        const cont = document.getElementById('weeklyCita');
        if (!cont || !wsMenu) return;
        const cita = wsMenu.cita || citaAleatoria();
        wsMenu.cita = cita;
        cont.innerHTML = '<div class="weekly-cita-inner">'
            + '<span class="weekly-cita-emoji">' + cita.emoji + '</span>'
            + '<span class="weekly-cita-texto">' + escapeHtml(cita.texto) + '</span>'
            + '<button class="weekly-cita-btn" onclick="wsCambiarCitaAleatoria()" title="Cambiar cita (aleatoria)">🎲</button>'
            + '<button class="weekly-cita-btn" onclick="wsAbrirSelectorCita()" title="Elegir cita de la lista">✏️</button>'
            + '</div>';
    }

    // Cambiar cita por una aleatoria (sin repetir la actual)
    function wsCambiarCitaAleatoria() {
        if (typeof citaAleatoria !== 'function') return;
        let nueva = citaAleatoria();
        let intentos = 0;
        while (wsMenu.cita && nueva.texto === wsMenu.cita.texto && intentos < 10) {
            nueva = citaAleatoria();
            intentos++;
        }
        wsMenu.cita = nueva;
        wsRenderWeeklyCita();
    }

    // Modal selector de las 50 citas
    function wsAbrirSelectorCita() {
        if (typeof CITAS === 'undefined' || !CITAS || CITAS.length === 0) {
            alert('No hay citas disponibles');
            return;
        }

        if (wsModalActual) { wsModalActual.remove(); wsModalActual = null; }

        const overlay = document.createElement('div');
        overlay.className = 'ws-modal-overlay';

        const modal = document.createElement('div');
        modal.className = 'ws-modal ws-cita-modal';

        // Header
        const header = document.createElement('div');
        header.className = 'ws-modal-header';
        header.innerHTML = '<h2 class="ws-modal-title">💬 Elige una cita motivacional</h2>';
        const closeBtn = document.createElement('button');
        closeBtn.className = 'ws-modal-close';
        closeBtn.innerHTML = '✕';
        closeBtn.onclick = () => wsCerrarModal();
        header.appendChild(closeBtn);
        modal.appendChild(header);

        // Toolbar
        const toolbar = document.createElement('div');
        toolbar.className = 'ws-modal-toolbar';
        const searchInput = document.createElement('input');
        searchInput.type = 'text';
        searchInput.className = 'ws-modal-search';
        searchInput.placeholder = '🔍 Buscar cita...';
        toolbar.appendChild(searchInput);

        const btnRandom = document.createElement('button');
        btnRandom.className = 'ws-modal-btn primary';
        btnRandom.textContent = '🎲 Aleatoria';
        btnRandom.onclick = () => {
            wsCambiarCitaAleatoria();
            wsCerrarModal();
        };
        toolbar.appendChild(btnRandom);
        modal.appendChild(toolbar);

        // Body
        const body = document.createElement('div');
        body.className = 'ws-modal-body';

        const renderCitas = (filtro) => {
            const q = (filtro || '').toLowerCase().trim();
            let html = '';
            CITAS.forEach((cita, idx) => {
                if (q && !cita.texto.toLowerCase().includes(q)) return;
                const esActual = wsMenu.cita && wsMenu.cita.texto === cita.texto;
                html += '<div class="ws-cita-item' + (esActual ? ' selected' : '') + '" '
                    +   'onclick="wsElegirCitaPorIndice(' + idx + ')">'
                    +   '<span class="ws-cita-item-emoji">' + cita.emoji + '</span>'
                    +   '<span class="ws-cita-item-texto">' + escapeHtml(cita.texto) + '</span>'
                    +   (esActual ? '<span class="ws-cita-item-check">✓</span>' : '')
                    + '</div>';
            });
            if (html === '') {
                html = '<div class="ws-lista-empty">No hay citas que coincidan.</div>';
            }
            return html;
        };

        body.innerHTML = renderCitas('');
        searchInput.addEventListener('input', () => {
            body.innerHTML = renderCitas(searchInput.value);
        });
        modal.appendChild(body);

        overlay.appendChild(modal);
        document.body.appendChild(overlay);
        wsModalActual = overlay;

        setTimeout(() => searchInput.focus(), 80);

        const onKey = (e) => { if (e.key === 'Escape') wsCerrarModal(); };
        document.addEventListener('keydown', onKey);
        overlay._onKey = onKey;

        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) wsCerrarModal();
        });
    }

    function wsElegirCitaPorIndice(idx) {
        if (typeof CITAS === 'undefined' || !CITAS[idx]) return;
        wsMenu.cita = { ...CITAS[idx] };
        wsCerrarModal();
        wsRenderWeeklyCita();
    }

    // PERSISTENCIA (localStorage)
    // =====================================================
    const WS_STORAGE_KEY = 'diet_weekly_menus';

    function wsLeerMenusGuardados() {
        try {
            const raw = localStorage.getItem(WS_STORAGE_KEY);
            if (!raw) return [];
            const arr = JSON.parse(raw);
            return Array.isArray(arr) ? arr : [];
        } catch (e) {
            console.error('Error leyendo menús guardados:', e);
            return [];
        }
    }

    function wsEscribirMenusGuardados(arr) {
        try {
            localStorage.setItem(WS_STORAGE_KEY, JSON.stringify(arr));
            return true;
        } catch (e) {
            console.error('Error guardando menús:', e);
            alert('❌ No se pudo guardar: ' + e.message);
            return false;
        }
    }

    // =====================================================

    function guardarWeeklyMenu() {
        // Sincronizar cambios pendientes del DOM al objeto
        document.querySelectorAll('.weekly-cell-input').forEach(cell => {
            const dia = cell.dataset.dia;
            const comida = cell.dataset.comida;
            if (dia && comida) {
                wsMenu.dias[dia][comida] = cell.textContent.trim();
            }
        });

        // Sincronizar nombre desde el input
        const inputNombre = document.querySelector('.weekly-nombre');
        if (inputNombre) wsMenu.nombre = inputNombre.value.trim();

        // Si no tiene nombre, pedirlo
        let nombre = wsMenu.nombre;
        if (!nombre) {
            nombre = prompt('Nombre del menú:', 'Semana del ' + new Date().toLocaleDateString('es-ES'));
            if (!nombre) return;
            nombre = nombre.trim();
            wsMenu.nombre = nombre;
        }

        // Comprobar que hay algo que guardar
        const tieneContenido = Object.values(wsMenu.dias).some(d =>
            Object.values(d).some(v => v && v.trim())
        );
        if (!tieneContenido) {
            if (!confirm('El menú está vacío. ¿Guardar igualmente?')) return;
        }

        const menus = wsLeerMenusGuardados();

        // Buscar si ya existe con el MISMO ID
        const porId = menus.findIndex(m => m.id === wsMenu.id);
        // Buscar si existe con el MISMO NOMBRE (pero otro id)
        const porNombre = menus.findIndex(m =>
            (m.nombre || '').toLowerCase().trim() === nombre.toLowerCase().trim()
        );

        let accion = 'nuevo';  // 'sobrescribir' | 'renombrar_existente' | 'nuevo'

        if (porId >= 0 && (menus[porId].nombre || '').toLowerCase().trim() === nombre.toLowerCase().trim()) {
            // Mismo id y mismo nombre → sobrescribir silencioso (es el mismo menú editado)
            accion = 'sobrescribir';
        } else if (porNombre >= 0 && menus[porNombre].id !== wsMenu.id) {
            // Hay otro menú con ese nombre pero distinto id
            const resp = confirm(
                '⚠️ Ya existe un menú guardado con el nombre "' + nombre + '".\n\n' +
                '¿Quieres SOBRESCRIBIRLO?\n\n' +
                '• Aceptar = sobrescribir el existente\n' +
                '• Cancelar = guardar el actual con otro nombre'
            );
            if (resp) {
                // Sobrescribir el que tiene ese nombre
                accion = 'renombrar_existente';
                wsMenu.id = menus[porNombre].id;   // Adoptamos su id
            } else {
                // Pedir nombre nuevo
                const nuevoNombre = prompt('Escribe un nombre distinto:', nombre + ' (copia)');
                if (!nuevoNombre) return;
                nombre = nuevoNombre.trim();
                wsMenu.nombre = nombre;
                wsMenu.id = 'wm_' + Date.now();    // ID nuevo
                accion = 'nuevo';
            }
        } else if (porId >= 0) {
            // Mismo id pero nombre cambiado → tratamos como "guardar como nuevo"
            // (El original con el nombre viejo sigue existiendo)
            wsMenu.id = 'wm_' + Date.now();
            accion = 'nuevo';
        } else {
            // No existe ni por id ni por nombre → nuevo
            if (!wsMenu.id || wsMenu.id.startsWith('wm_') === false) {
                wsMenu.id = 'wm_' + Date.now();
            }
            accion = 'nuevo';
        }

        // Copia limpia
        const copia = {
            id: wsMenu.id,
            nombre: nombre,
            cita: wsMenu.cita,
            dias: JSON.parse(JSON.stringify(wsMenu.dias)),
            fechaGuardado: new Date().toISOString()
        };

        if (accion === 'sobrescribir' || accion === 'renombrar_existente') {
            const idx = menus.findIndex(m => m.id === copia.id);
            if (idx >= 0) {
                menus[idx] = copia;
            } else {
                menus.push(copia);
            }
        } else {
            // Nuevo → añadir al array
            menus.push(copia);
        }

        if (wsEscribirMenusGuardados(menus)) {
            let msg = '';
            if (accion === 'sobrescribir') {
                msg = '✅ Menú actualizado: "' + nombre + '"';
            } else if (accion === 'renombrar_existente') {
                msg = '✅ Menú sobrescrito: "' + nombre + '"';
            } else {
                msg = '✅ Menú guardado como NUEVO: "' + nombre + '"';
            }
            alert(msg + '\n\nTotal menús guardados: ' + menus.length);
            wsRenderWeekly();
        }
    }


    function cargarWeeklyMenu() {
        const menus = wsLeerMenusGuardados();
        if (menus.length === 0) {
            alert('📂 No hay menús guardados todavía.\n\nCrea uno y pulsa 💾 Guardar.');
            return;
        }

        // Mostrar lista como prompt numerado
        let msg = '📂 Menús guardados:\n\n';
        menus.forEach((m, i) => {
            const fecha = m.fechaGuardado
                ? new Date(m.fechaGuardado).toLocaleDateString('es-ES')
                : '?';
            msg += '  ' + (i + 1) + '. ' + (m.nombre || '(sin nombre)') + '  —  ' + fecha + '\n';
        });
        msg += '\nEscribe el número a cargar (o 0 para cancelar):';

        const resp = prompt(msg);
        if (!resp) return;
        const n = parseInt(resp, 10);
        if (!n || n < 1 || n > menus.length) return;

        const elegido = menus[n - 1];

        // Cargar en memoria
        wsMenu = {
            id: elegido.id,
            nombre: elegido.nombre || '',
            cita: elegido.cita || citaAleatoria(),
            dias: JSON.parse(JSON.stringify(elegido.dias))
        };

        wsRenderWeekly();
        alert('✅ Menú cargado: "' + (elegido.nombre || '(sin nombre)') + '"');
    }

            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function imprimirMenu() {
        const html = wsConstruirHtmlImpresion();

        // Crear iframe oculto (más limpio que window.open)
        let iframe = document.getElementById('wsPrintFrame');
        if (iframe) iframe.remove();

        iframe = document.createElement('iframe');
        iframe.id = 'wsPrintFrame';
        iframe.style.position = 'fixed';
        iframe.style.right = '0';
        iframe.style.bottom = '0';
        iframe.style.width = '0';
        iframe.style.height = '0';
        iframe.style.border = '0';
        document.body.appendChild(iframe);

        const doc = iframe.contentDocument || iframe.contentWindow.document;
        doc.open();
        doc.write(html);
        doc.close();

        // Esperar a que cargue y lanzar print
        iframe.onload = function() {
            setTimeout(function() {
                try {
                    iframe.contentWindow.focus();
                    iframe.contentWindow.print();
                } catch (e) {
                    console.error('Error al imprimir:', e);
                    alert('❌ Error al abrir el diálogo de impresión: ' + e.message);
                }
            }, 250);
        };

        // Fallback por si onload ya pasó
        setTimeout(function() {
            if (!iframe.dataset.printed) {
                iframe.dataset.printed = '1';
                try {
                    iframe.contentWindow.focus();
                    iframe.contentWindow.print();
                } catch (e) {}
            }
        }, 600);
    }

    // Palabras genéricas que se ignoran (siempre hay en casa)
    const WS_IGNORAR_PLATOS = [
        'fruta', 'frutas', 'yogur', 'pan', 'zumo', 'agua', 'leche',
        'fruta de temporada', 'fruta fresca', 'fruta y yogur',
        'fruta y frutos secos', 'fruta + yogur', 'fruta + frutos secos',
        'zumo natural', 'zumo natural y fruta', 'zumo + fruta',
        'yogur natural', 'yogur natural con nueces', 'yogur griego',
        'yogur griego con nueces', 'yogur con cereales', 'yogur con cereales y miel',
        'puñado de almendras', 'almendras', 'nueces', 'frutos secos',
        'manzana', 'plátano', 'batido de plátano', 'batido'
    ];

    function wsNormalizarTexto(txt) {
        return String(txt || '')
            .toLowerCase()
            .trim()
            .replace(/\s+/g, ' ');
    }

    function wsEsPlatoIgnorable(txt) {
        const t = wsNormalizarTexto(txt);
        if (!t) return true;
        return WS_IGNORAR_PLATOS.indexOf(t) !== -1;
    }

    function wsExtraerPlatos() {
        // Sincronizar DOM antes
        wsSincronizarDesdeDOM();

        const contador = {};  // { "tortilla de patatas": { veces: 2, dias: ['lunes', 'domingo'], textoOriginal: 'Tortilla de patatas' } }

        WS_DIAS_SEMANA.forEach(diaId => {
            WS_COMIDAS.forEach(comidaId => {
                const texto = (wsMenu.dias[diaId][comidaId] || '').trim();
                if (!texto) return;
                if (wsEsPlatoIgnorable(texto)) return;

                const clave = wsNormalizarTexto(texto);
                if (!contador[clave]) {
                    contador[clave] = {
                        veces: 0,
                        dias: [],
                        textoOriginal: texto
                    };
                }
                contador[clave].veces += 1;
                contador[clave].dias.push(diaId);
            });
        });

        // Convertir a array y ordenar por veces (desc), luego alfabético
        const arr = Object.keys(contador).map(k => {
            const item = contador[k];
            return {
                texto: item.textoOriginal,
                veces: item.veces,
                dias: item.dias
            };
        });

        arr.sort((a, b) => {
            if (b.veces !== a.veces) return b.veces - a.veces;
            return a.texto.localeCompare(b.texto, 'es');
        });

        return arr;
    }

            if (wsEditorListaActual._onKey) {

    function wsAñadirItemLista(texto) {
        const t = (texto || '').trim();
        if (!t) return;

        // Evitar duplicado
        const dup = wsListaEditable.find(x =>
            wsNormalizarTexto(x.texto) === wsNormalizarTexto(t)
        );
        if (dup) {
            dup.veces += 1;
            return;
        }

        wsListaEditable.push({
            id: 'item_new_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
            texto: t.charAt(0).toUpperCase() + t.slice(1),
            veces: 1,
            dias: [],
            marcado: false,
            esNuevo: true
        });
    }

    function wsRenderListaEditable() {
        const body = document.getElementById('wsListaBody');
        if (!body) return;

        const q = (document.getElementById('wsListaSearch')?.value || '').trim().toLowerCase();

        // Ordenar: no marcados primero (por veces desc), luego marcados
        const items = wsListaEditable.slice().sort((a, b) => {
            if (a.marcado !== b.marcado) return a.marcado ? 1 : -1;
            if (b.veces !== a.veces) return b.veces - a.veces;
            return a.texto.localeCompare(b.texto, 'es');
        });

        // Filtrar por buscador
        const visibles = items.filter(it => !q || it.texto.toLowerCase().includes(q));

        let html = '';

        html += '<div class="ws-lista-info">';
        html +=   '📊 <b>' + wsListaEditable.length + '</b> items · ';
        html +=   '<b>' + wsListaEditable.filter(x => x.marcado).length + '</b> ya comprados · ';
        html +=   '<b>' + wsListaEditable.reduce((s, x) => s + x.veces, 0) + '</b> comidas totales';
        html += '</div>';

        html += '<div class="ws-lista-rows">';

        visibles.forEach((it, idx) => {
            const diasTxt = it.dias.length > 0
                ? it.dias.map(d => (WS_EMOJIS_DIA[d] || '') + ' ' + (WS_DIAS_ETIQUETA[d] || d).slice(0, 3)).join(', ')
                : '<span style="color:#94a3b8;font-style:italic">(manual)</span>';

            html += '<div class="ws-lista-row' + (it.marcado ? ' marcado' : '') + (it.esNuevo ? ' nuevo' : '') + '" data-id="' + it.id + '">';
            html +=   '<div class="ws-lista-check" onclick="wsToggleMarcado(\'' + it.id + '\')">' + (it.marcado ? '☑' : '☐') + '</div>';
            html +=   '<div class="ws-lista-texto" ondblclick="wsEditarTextoItem(\'' + it.id + '\')" title="Doble clic para editar">' + escapeHtml(it.texto) + '</div>';
            html +=   '<div class="ws-lista-veces">';
            html +=     '<button class="ws-mini-btn" onclick="wsCambiarVeces(\'' + it.id + '\', -1)">−</button>';
            html +=     '<span class="ws-veces-num">' + it.veces + '</span>';
            html +=     '<button class="ws-mini-btn" onclick="wsCambiarVeces(\'' + it.id + '\', 1)">+</button>';
            html +=   '</div>';
            html +=   '<div class="ws-lista-dias" title="Días que se repite">' + diasTxt + '</div>';
            html +=   '<button class="ws-lista-del" onclick="wsEliminarItemLista(\'' + it.id + '\')" title="Eliminar">🗑️</button>';
            html += '</div>';
        });

        if (visibles.length === 0) {
            html += '<div class="ws-lista-empty">';
            html += q ? 'No hay items que coincidan con "' + escapeHtml(q) + '"' : 'La lista está vacía. Añade items con el campo de arriba.';
            html += '</div>';
        }

        html += '</div>';

        body.innerHTML = html;
    }

    function wsToggleMarcado(id) {
        const it = wsListaEditable.find(x => x.id === id);
        if (!it) return;
        it.marcado = !it.marcado;
        wsRenderListaEditable();
    }

    function wsCambiarVeces(id, delta) {
        const it = wsListaEditable.find(x => x.id === id);
        if (!it) return;
        it.veces = Math.max(1, it.veces + delta);
        wsRenderListaEditable();
    }

    function wsEliminarItemLista(id) {
        const idx = wsListaEditable.findIndex(x => x.id === id);
        if (idx === -1) return;
        wsListaEditable.splice(idx, 1);
        wsRenderListaEditable();
    }

    function wsEditarTextoItem(id) {
        const it = wsListaEditable.find(x => x.id === id);
        if (!it) return;
        const nuevo = prompt('Editar item:', it.texto);
        if (nuevo === null) return;
        const t = nuevo.trim();
        if (!t) return;
        it.texto = t;
        wsRenderListaEditable();
    }

    function wsImprimirListaFinal() {
        // Detectar PWA en iPad y avisar
        if (wsEsPWA()) {
            wsMostrarAvisoSafari('imprimir');
            return;
        }

        // Construir HTML con los items editados (todos, marcados o no)
        const html = wsConstruirHtmlListaFinal();

        // Reutilizar iframe de impresión
        let iframe = document.getElementById('wsPrintFrameLista');
        if (iframe) iframe.remove();

        iframe = document.createElement('iframe');
        iframe.id = 'wsPrintFrameLista';
        iframe.style.position = 'fixed';
        iframe.style.right = '0';
        iframe.style.bottom = '0';
        iframe.style.width = '0';
        iframe.style.height = '0';
        iframe.style.border = '0';
        document.body.appendChild(iframe);

        const doc = iframe.contentDocument || iframe.contentWindow.document;
        doc.open();
        doc.write(html);
        doc.close();

        iframe.onload = function() {
            setTimeout(function() {
                try {
                    iframe.contentWindow.focus();
                    iframe.contentWindow.print();
                } catch (e) {
                    console.error('Error al imprimir:', e);
                    alert('❌ Error: ' + e.message);
                }
            }, 250);
        };
    }

    // =====================================================
    // DETECCIÓN DE PWA (iPad "Añadir a pantalla de inicio")
    // =====================================================
    function wsEsPWA() {
        return (window.navigator.standalone === true) ||
               (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    }

    function wsAbrirEnSafari(url) {
        // En iOS, abrir en Safari desde PWA
        window.open(url, '_blank');
    }

    function wsMostrarAvisoSafari(accion) {
        // accion: 'imprimir' o 'descargar'
        const mensaje = accion === 'imprimir'
            ? '🖨️ Para imprimir necesitas abrir la app desde Safari.\n\n¿Quieres abrirla ahora en Safari?'
            : '📄 Para descargar el PDF necesitas abrir la app desde Safari.\n\n¿Quieres abrirla ahora en Safari?';

        if (confirm(mensaje)) {
            // Abrir la misma URL en Safari
            wsAbrirEnSafari(window.location.href);
        }
    }

    function wsCompartirLista() {
        // Generar HTML para compartir/imprimir
        const html = wsConstruirHtmlListaFinal();

        // 1. Intentar navigator.share con archivo (iPad, móviles modernos)
        if (navigator.canShare && navigator.share) {
            try {
                // Convertir a Blob como archivo .html
                const blob = new Blob([html], { type: 'text/html' });
                const file = new File([blob], 'lista-compra.html', { type: 'text/html' });

                if (navigator.canShare({ files: [file] })) {
                    navigator.share({
                        files: [file],
                        title: '🛒 Lista de la compra',
                        text: 'Lista de la compra de la semana'
                    }).then(() => {
                        console.log('✅ Compartido');
                    }).catch((err) => {
                        if (err.name !== 'AbortError') {
                            console.error('Error compartiendo:', err);
                            wsFallbackImprimir();
                        }
                    });
                    return;
                }
            } catch (e) {
                console.warn('Error preparando share:', e);
            }
        }

        // 2. Fallback: imprimir (Safari) o aviso (PWA)
        if (wsEsPWA()) {
            wsMostrarAvisoSafari('descargar');
        } else {
            wsFallbackImprimir();
        }
    }

    function wsFallbackImprimir() {
        // Intenta imprimir directamente
        const html = wsConstruirHtmlListaFinal();
        let iframe = document.getElementById('wsPrintFrameLista');
        if (iframe) iframe.remove();

        iframe = document.createElement('iframe');
        iframe.id = 'wsPrintFrameLista';
        iframe.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;';
        document.body.appendChild(iframe);

        const doc = iframe.contentDocument || iframe.contentWindow.document;
        doc.open();
        doc.write(html);
        doc.close();

        iframe.onload = function() {
            setTimeout(function() {
                try {
                    iframe.contentWindow.focus();
                    iframe.contentWindow.print();
                } catch (e) {
                    console.error('Error al imprimir:', e);
                }
            }, 250);
        };
    }

    function wsDescargarListaPDF() {
        // Detectar PWA en iPad y avisar
        if (wsEsPWA()) {
            wsMostrarAvisoSafari('descargar');
            return;
        }

        // Aviso la primera vez
        const key = 'ws_pdf_hint_shown';
        if (!localStorage.getItem(key)) {
            alert('📄 Se abrirá el diálogo de impresión.\n\nElige "Guardar como PDF" en el destino para descargar la lista como archivo PDF.');
            localStorage.setItem(key, '1');
        }
        wsImprimirListaFinal();
    }

    function wsConstruirHtmlListaFinal() {
        const numSemana = (typeof semanaDelAño === 'function') ? semanaDelAño() : '';
        const items = wsListaEditable.slice().sort((a, b) => {
            if (a.marcado !== b.marcado) return a.marcado ? 1 : -1;
            if (b.veces !== a.veces) return b.veces - a.veces;
            return a.texto.localeCompare(b.texto, 'es');
        });

        let html = '';
        html += '<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">';
        html += '<title>Lista de la compra</title>';
        html += '<style>' + wsCssListaFinal() + '</style>';
        html += '</head><body>';

        html += '<div class="header-lista">';
        html +=   '<div class="decor-lista">🛒🥕🍎🧺🍇</div>';
        html +=   '<h1>🛒 LISTA DE LA COMPRA</h1>';
        if (wsMenu.nombre) {
            html += '<div class="subtitulo-lista">' + wsEscaparHtml(wsMenu.nombre) + '</div>';
        }
        if (numSemana) {
            html += '<div class="semana-lista">Semana ' + numSemana + '</div>';
        }
        html += '</div>';

        html += '<div class="instrucciones">✏️ Marca con una <b>✓</b> lo que vayas comprando.</div>';

        if (items.length === 0) {
            html += '<div class="vacio">La lista está vacía.</div>';
        } else {
            html += '<table class="lista">';
            html += '<thead><tr><th class="check-col">✓</th><th class="plato-col">Plato</th><th class="veces-col">Veces</th><th class="dias-col">Días</th></tr></thead>';
            html += '<tbody>';

            items.forEach(p => {
                const diasEtiqueta = p.dias.length > 0
                    ? p.dias.map(d => (WS_EMOJIS_DIA[d] || '') + ' ' + (WS_DIAS_ETIQUETA[d] || d).slice(0, 3)).join(', ')
                    : '—';
                html += '<tr' + (p.marcado ? ' class="marcado"' : '') + '>';
                html +=   '<td class="check-col">☐</td>';
                html +=   '<td class="plato-col">' + wsEscaparHtml(p.texto) + '</td>';
                html +=   '<td class="veces-col"><b>' + p.veces + '</b></td>';
                html +=   '<td class="dias-col">' + diasEtiqueta + '</td>';
                html += '</tr>';
            });

            html += '</tbody></table>';
        }

        const totalComidas = items.reduce((s, x) => s + x.veces, 0);
        html += '<div class="resumen-lista">';
        html +=   '📊 <b>' + items.length + '</b> platos distintos · <b>' + totalComidas + '</b> comidas en total';
        html += '</div>';

        html += '<div class="notas-lista">📝 Notas: ______________________________________________</div>';

        html += '</body></html>';
        return html;
    }

    // ===== NUEVA FUNCIÓN: Añadir alimento manual =====
    function addCustomFood() {
        const input = document.getElementById('gen-custom-input');
        if (!input) return;
        const value = input.value.trim();
        if (!value) {
            input.focus();
            return;
        }
        // Capitalizar primera letra
        const formatted = value.charAt(0).toUpperCase() + value.slice(1);
        
        // Guardar en customFoods (por tipo de comida)
        if (!customFoods[genState.meal]) customFoods[genState.meal] = [];
        if (!customFoods[genState.meal].includes(formatted)) {
            customFoods[genState.meal].push(formatted);
            saveToStorage('customFoods');
        }
        
        // Añadir a la selección actual
        if (!genState.selected.includes(formatted)) {
            genState.selected.push(formatted);
        }
        
        input.value = '';
        renderGenerator();
        // Focus de nuevo al input para seguir añadiendo
        setTimeout(() => {
            const newInput = document.getElementById('gen-custom-input');
            if (newInput) newInput.focus();
        }, 50);
    }

    function saveCurrentMenu() {
        if (genState.selected.length === 0) {
            alert('Selecciona al menos un alimento antes de guardar.');
            return;
        }
        const defaultName = `${MEAL_NAMES[genState.meal].split(' ')[1] || 'Menú'} ${customMenus.length + 1}`;
        const name = prompt('Ponle un nombre al menú:', defaultName);
        if (!name || !name.trim()) return;
        customMenus.push({
            name: name.trim(),
            meal: genState.meal,
            items: [...genState.selected],
            createdAt: new Date().toISOString()
        });
        saveToStorage('customMenus');
        genState.selected = [];
        renderGenerator();
        alert('✅ Menú guardado. Ya puedes usarlo desde el Menú Chicos o desde Plan Personal pulsando "📂 Elegir".');
    }

    // =====================================================
    // HELPERS
    // =====================================================
    function formatExtraContent(text) {
        if (!text) return '<p><em>Sin contenido</em></p>';
        const lines = text.split(/\n/);
        let html = '';
        let inList = false;
        lines.forEach(line => {
            const trimmed = line.trim();
            if (!trimmed) {
                if (inList) { html += '</ul>'; inList = false; }
                html += '<br>';
                return;
            }
            if (trimmed.match(/^[-•*]\s/)) {
                if (!inList) { html += '<ul>'; inList = true; }
                html += `<li>${escapeHtml(trimmed.replace(/^[-•*]\s/, ''))}</li>`;
            } else if (trimmed.match(/^[A-ZÁÉÍÓÚÑ\s]+$/) && trimmed.length > 5 && trimmed.length < 80) {
                if (inList) { html += '</ul>'; inList = false; }
                html += `<h3>${escapeHtml(trimmed)}</h3>`;
            } else {
                if (inList) { html += '</ul>'; inList = false; }
                html += `<p>${escapeHtml(trimmed)}</p>`;
            }
        });
        if (inList) html += '</ul>';
        return html || `<p>${escapeHtml(text)}</p>`;
    }

        savedBtn.style.background = 'var(--generator-color)';
        savedBtn.style.marginRight = '5px';
        savedBtn.onclick = (e) => { e.preventDefault(); e.stopPropagation(); openSavedMenusPicker(block, { dayName: day }, mealId, 'plan'); };
        actionsDiv.appendChild(savedBtn);
        const editBtn = document.createElement('button');
        editBtn.className = 'btn btn-small';
        editBtn.textContent = '✏️ Editar';
        editBtn.onclick = (e) => { e.preventDefault(); e.stopPropagation(); toggleEditMode(block, day, mealId, source); };
        actionsDiv.appendChild(editBtn);
        header.appendChild(actionsDiv);
        block.appendChild(header);
        const content = document.createElement('div');
        content.className = 'meal-content';
        content.innerHTML = formatMealContent(meal.content);
        block.appendChild(content);
        return block;
    }

    function createEmptyMealBlock(day, mealId, source) {
        const block = document.createElement('div');
        block.className = 'meal-block empty-meal';
        block.dataset.day = day;
        block.dataset.meal = mealId;
        block.dataset.source = source;
        const header = document.createElement('div');
        header.className = 'meal-header';
        const title = document.createElement('div');
        title.className = 'meal-title';
        title.textContent = MEAL_NAMES[mealId];
        header.appendChild(title);
        const actionsDiv = document.createElement('div');
        actionsDiv.className = 'meal-actions';
        const savedBtn = document.createElement('button');
        savedBtn.className = 'btn btn-small';
        savedBtn.textContent = '📂 Elegir';
        savedBtn.style.background = 'var(--generator-color)';
        savedBtn.style.marginRight = '5px';
        savedBtn.onclick = (e) => { e.preventDefault(); e.stopPropagation(); openSavedMenusPicker(block, { dayName: day }, mealId, 'plan'); };
        actionsDiv.appendChild(savedBtn);
        const editBtn = document.createElement('button');
        editBtn.className = 'btn btn-small';
        editBtn.textContent = '✏️ Añadir';
        editBtn.onclick = (e) => { e.preventDefault(); e.stopPropagation(); toggleEditEmpty(block, day, mealId, source); };
        actionsDiv.appendChild(editBtn);
        header.appendChild(actionsDiv);
        block.appendChild(header);
        const content = document.createElement('div');
        content.className = 'meal-content empty';
        content.textContent = 'Sin contenido. Pulsa "Elegir" o "Añadir".';
        block.appendChild(content);
        return block;
    }

    function formatMealContent(content) {
        if (!content) return '<p><em>Sin contenido</em></p>';
        let contentHtml = '';
        const upperContent = content.toUpperCase();
        const ingredientesIndex = upperContent.indexOf('INGREDIENTES');
        const recetaIndex = upperContent.indexOf('RECETA');
        if (ingredientesIndex !== -1 && recetaIndex !== -1 && recetaIndex > ingredientesIndex) {
            const beforeIng = content.substring(0, ingredientesIndex).trim();
            const ingText = content.substring(ingredientesIndex, recetaIndex).trim();
            const recetaText = content.substring(recetaIndex).trim();
            if (beforeIng) contentHtml += `<p>${escapeHtml(beforeIng)}</p>`;
            contentHtml += `<div class="ingredients-list"><strong>${escapeHtml(ingText)}</strong></div>`;
            contentHtml += `<div class="recipe-text">${escapeHtml(recetaText)}</div>`;
        } else {
            contentHtml = `<p>${escapeHtml(content)}</p>`;
        }
        return contentHtml;
    }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function toggleEditMode(block, day, mealId, source) {
        const mealContent = block.querySelector('.meal-content');
        const editBtn = block.querySelectorAll('.meal-actions .btn')[1] || block.querySelector('.meal-actions .btn');
        const isEditing = mealContent.getAttribute('contenteditable') === 'true';
        if (!isEditing) {
            mealContent.setAttribute('contenteditable', 'true');
            mealContent.focus();
            editBtn.textContent = '💾 Guardar';
            editBtn.classList.add('btn-secondary');
            const indicator = document.createElement('span');
            indicator.className = 'editing-indicator';
            indicator.textContent = '✏️ Editando...';
            mealContent.parentNode.insertBefore(indicator, mealContent);
        } else {
            mealContent.setAttribute('contenteditable', 'false');
            editBtn.textContent = '✏️ Editar';
            editBtn.classList.remove('btn-secondary');
            const indicator = block.querySelector('.editing-indicator');
            if (indicator) indicator.remove();
            const newContent = mealContent.innerText.trim();
            if (source === 'plan' && personalData.plan[day] && personalData.plan[day][mealId]) {
                personalData.plan[day][mealId].content = newContent;
                saveToStorage('personal');
            }
            mealContent.innerHTML = formatMealContent(newContent);
        }
    }

    function toggleEditEmpty(block, day, mealId, source) {
        const mealContent = block.querySelector('.meal-content');
        const editBtn = block.querySelectorAll('.meal-actions .btn')[1] || block.querySelector('.meal-actions .btn');
        const isEditing = mealContent.getAttribute('contenteditable') === 'true';
        if (!isEditing) {
            mealContent.classList.remove('empty');
            if (mealContent.textContent.includes('Sin contenido')) mealContent.textContent = '';
            mealContent.setAttribute('contenteditable', 'true');
            mealContent.focus();
            editBtn.textContent = '💾 Guardar';
            editBtn.classList.add('btn-secondary');
            block.classList.remove('empty-meal');
            const indicator = document.createElement('span');
            indicator.className = 'editing-indicator';
            indicator.textContent = '✏️ Editando...';
            mealContent.parentNode.insertBefore(indicator, mealContent);
        } else {
            mealContent.setAttribute('contenteditable', 'false');
            editBtn.textContent = '✏️ Editar';
            editBtn.classList.remove('btn-secondary');
            const indicator = block.querySelector('.editing-indicator');
            if (indicator) indicator.remove();
            const newContent = mealContent.innerText.trim();
            if (source === 'plan' && personalData) {
                if (!personalData.plan[day]) personalData.plan[day] = {};
                personalData.plan[day][mealId] = { title: MEAL_NAMES[mealId], content: newContent };
                saveToStorage('personal');
            }
            if (!newContent) {
                mealContent.classList.add('empty');
                mealContent.textContent = 'Sin contenido. Pulsa "Elegir" o "Añadir".';
                block.classList.add('empty-meal');
                editBtn.textContent = '✏️ Añadir';
            }
        }
    }

    function applyFilters() {
        const dayFilterVal = filterDay.value;
        const mealFilterVal = filterMeal.value;
        const searchFilter = searchText.value.toLowerCase().trim();
        document.querySelectorAll('#tab-personal .day-block, #tab-personal .day-details').forEach(dayEl => {
            const dayName = dayEl.dataset.day;
            let dayVisible = (dayFilterVal === 'all' || dayFilterVal === dayName);
            let anyMealVisible = false;
            dayEl.querySelectorAll('.meal-block').forEach(mealEl => {
                const mealType = mealEl.dataset.meal;
                const content = mealEl.querySelector('.meal-content').innerText.toLowerCase();
                const mealMatch = (mealFilterVal === 'all' || mealFilterVal === mealType);
                const searchMatch = (!searchFilter || content.includes(searchFilter));
                const visible = mealMatch && searchMatch;
                if (visible) { mealEl.classList.remove('hidden'); anyMealVisible = true; }
                else mealEl.classList.add('hidden');
            });
            if (dayVisible && anyMealVisible) dayEl.classList.remove('hidden');
            else dayEl.classList.add('hidden');
        });
        document.querySelectorAll('#tab-school .day-block, #tab-school .day-details').forEach(dayEl => {
            const dayName = dayEl.dataset.day;
            let dayVisible = (dayFilterVal === 'all' || dayFilterVal === dayName);
            let anyMealVisible = false;
            dayEl.querySelectorAll('.meal-block').forEach(mealEl => {
                const mealType = mealEl.dataset.meal;
                const content = mealEl.querySelector('.meal-content').innerText.toLowerCase();
                const mealMatch = (mealFilterVal === 'all' || mealFilterVal === mealType);
                const searchMatch = (!searchFilter || content.includes(searchFilter));
                const visible = mealMatch && searchMatch;
                if (visible) { mealEl.classList.remove('hidden'); anyMealVisible = true; }
                else mealEl.classList.add('hidden');
            });
            if (dayVisible && anyMealVisible) dayEl.classList.remove('hidden');
            else dayEl.classList.add('hidden');
        });
    }

    filterDay.addEventListener('change', applyFilters);
    filterMeal.addEventListener('change', applyFilters);
    searchText.addEventListener('input', applyFilters);

    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
        });
    });

    btnExport.addEventListener('click', () => {
        const dataStr = JSON.stringify({ 
            personal: personalData ? { data: personalData, rawText: personalRawText } : null,
            school: schoolData ? { data: schoolData, rawText: schoolRawText } : null,
            customMenus: customMenus,
            customFoods: customFoods
        }, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'menus.json';
        a.click();
        URL.revokeObjectURL(url);
        closeMenu();
    });

    btnPrint.addEventListener('click', () => {
        document.querySelectorAll('details').forEach(d => d.setAttribute('open', ''));
        window.print();
        closeMenu();
    });

    btnResetPersonal.addEventListener('click', () => {
        if (confirm('¿Borrar el Plan Personal?')) {
            localStorage.removeItem(STORAGE_PERSONAL);
            personalData = null; personalRawText = '';
            document.getElementById('tab-personal').innerHTML = '';
            document.getElementById('tab-shopping').innerHTML = '';
            document.getElementById('tab-advice').innerHTML = '';
            document.getElementById('tab-allergens').innerHTML = '';
            renderAll(); closeMenu();
        }
    });

    btnResetSchool.addEventListener('click', () => {
        if (confirm('¿Borrar el Menú Escolar?')) {
            localStorage.removeItem(STORAGE_SCHOOL);
            schoolData = null; schoolRawText = '';
            document.getElementById('tab-school').innerHTML = '';
            renderAll(); closeMenu();
        }
    });

</script>
