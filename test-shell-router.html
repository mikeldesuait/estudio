<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Shell + Router</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/shell/shell.css">
  <link rel="stylesheet" href="css/shell/pomodoro-config.css">
</head>
<body>
  <main id="mainContent" class="container">
    <div style="padding:40px;text-align:center;color:#718096;">Cargando...</div>
  </main>

  <script>
    /* ─── BASE detectada desde el <script> actual, NO desde location ─── */
    (function() {
      // En local servimos desde la raíz de ~/estudio → BASE = ''
      // En GitHub Pages servimos desde /estudio/ → BASE = '/estudio'
      // Detectamos por la ruta del propio script (que sabemos que existe)
      const scripts = document.querySelectorAll('script[src]');
      let base = '';

      for (const s of scripts) {
        const src = s.getAttribute('src');
        if (src && src.startsWith('js/')) {
          // Calculamos la base a partir de la URL absoluta del script
          const scriptUrl = new URL(src, window.location.href);
          base = scriptUrl.pathname.replace(/\/js\/.*$/, '');
          break;
        }
      }

      window.BASE = base;
      console.log('🌐 BASE detectada:', window.BASE || '(raíz)');
    })();

    /* ─── Helper: construir URL absoluta desde la base ─── */
    window.url = function(ruta) {
      ruta = ruta.replace(/^\//, ''); // quitar / inicial
      const base = window.BASE || '';
      return base + '/' + ruta;
    };

    /* ─── Cargar áreas ─── */
    window.AREAS = [];
    const LISTA_AREAS = [
      { id: 'grado-derecho' },
      { id: 'pnl' },
      { id: 'herramientas' },
      { id: 'networking' },
      { id: 'dieta' }
    ];

    Promise.all(LISTA_AREAS.map(item =>
      fetch(url('estudio/' + item.id + '/config.json'))
        .then(r => r.json())
        .then(data => { window.AREAS.push({ id: item.id, ...data }); })
        .catch(e => console.warn('No se pudo cargar', item.id, e))
    )).then(() => {
      console.log('✅ Áreas cargadas:', window.AREAS.length);
    });
  </script>

  <script src="js/widgets/progreso.js"></script>
  <script src="js/widgets/pomodoro.js"></script>
  <script src="js/core/router.js"></script>
  <script src="js/vistas/index.js"></script>
  <script src="js/core/shell.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Shell.montar();

      // Detectar si venimos de una URL con ?nivel=...
      const params = new URLSearchParams(window.location.search);
      const nivel = params.get('nivel') || 'escritorio';

      if (nivel === 'escritorio') {
        Router.navegar('escritorio');
      } else {
        const p = {};
        if (params.get('area')) p.areaId = params.get('area');
        if (params.get('curso')) p.cursoId = params.get('curso');
        if (params.get('semestre')) p.semestreId = params.get('semestre');
        if (params.get('asignatura')) p.asignaturaId = params.get('asignatura');
        if (params.get('tema')) p.temaId = params.get('tema');
        Router.navegar(nivel, p);
      }
    });
  </script>
</body>
</html>
